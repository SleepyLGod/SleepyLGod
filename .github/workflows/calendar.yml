name: Generate optional activity cards

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test contribution calculations and failure handling
        run: python -m unittest discover -s tests -v
      - name: Generate repository-hosted contribution cards
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/update_profile.py --username "$PROFILE_USER"
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/activity-*.svg assets/profile/calendar-*.svg
          if git diff --cached --quiet; then
            echo "Profile cards are already current."
            exit 0
          fi
          git commit -m "chore: refresh profile activity [skip ci]"
          git push
