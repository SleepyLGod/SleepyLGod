name: Refresh profile snapshot

on:
  schedule:
    - cron: "37 22 * * *" # 06:37 Hong Kong time; GitHub schedules may be delayed.
  workflow_dispatch:
  push:
    branches: [main, codex/profile-repo-shelf-20261106]
    paths:
      - .github/workflows/code-atlas.yml
      - scripts/update_code_atlas.py
      - tests/test_code_atlas.py
      - scripts/build_repo_shelf.py
      - profile/recommendations.json
      - tests/test_repo_shelf.py

permissions:
  contents: read

concurrency:
  group: profile-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/profile-repo-shelf-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PROFILE_ASSET_BRANCH: ${{ github.ref == 'refs/heads/main' && 'profile-assets' || 'profile-shelf-preview-assets' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test public statistics and snapshot preservation
        run: python -m unittest discover -s tests -v
      - name: Refresh recent contributions and Stars
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/update_code_atlas.py --username "$PROFILE_USER" --output "$RUNNER_TEMP/code-atlas"
      - name: Refresh recommended repository Stars and Forks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_repo_shelf.py --refresh --no-readme --output "$RUNNER_TEMP/recommendations"
      - name: Publish profile images to resource branch
        run: |
          git fetch --depth=1 origin "refs/heads/$PROFILE_ASSET_BRANCH:refs/remotes/origin/$PROFILE_ASSET_BRANCH"
          git switch --create "$PROFILE_ASSET_BRANCH" --track "origin/$PROFILE_ASSET_BRANCH"
          cp "$RUNNER_TEMP"/code-atlas/code-atlas*.svg assets/profile/
          cp "$RUNNER_TEMP"/code-atlas/code-atlas.json assets/profile/
          cp "$RUNNER_TEMP"/recommendations/*.svg assets/recommendations/
          cp "$RUNNER_TEMP"/recommendations/stats.json assets/recommendations/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/code-atlas*.svg assets/profile/code-atlas.json assets/recommendations/*.svg assets/recommendations/stats.json
          if git diff --cached --quiet; then
            echo "Profile images are already current."
            exit 0
          fi
          git commit -m "chore: refresh profile snapshots [skip ci]"
          git push origin "HEAD:refs/heads/$PROFILE_ASSET_BRANCH"
